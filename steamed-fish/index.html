<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葱油蒸鲈鱼 - 治愈系美食</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-container">
        <!-- 场景 1: 开场 -->
        <section class="scene scene-hero active" data-scene="1">
            <div class="scene-background">
                <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                    <defs>
                        <radialGradient id="skyGradient" cx="50%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#FFE4C9"/>
                            <stop offset="50%" stop-color="#FFD4A8"/>
                            <stop offset="100%" stop-color="#FFC08A"/>
                        </radialGradient>
                        <linearGradient id="seaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#6CB4D8"/>
                            <stop offset="100%" stop-color="#3D8AAB"/>
                        </linearGradient>
                    </defs>
                    <rect width="1200" height="800" fill="url(#skyGradient)"/>
                    <path d="M0 500 Q300 450 600 500 T1200 500 L1200 800 L0 800 Z" fill="url(#seaGradient)"/>
                    <circle cx="200" cy="150" r="60" fill="#FFB347" opacity="0.9">
                        <animate attributeName="opacity" values="0.7;0.95;0.7" dur="4s" repeatCount="indefinite"/>
                    </circle>
                    <g class="cloud" transform="translate(100, 80)">
                        <ellipse cx="0" cy="0" rx="50" ry="30" fill="white" opacity="0.85"/>
                        <ellipse cx="40" cy="5" rx="40" ry="25" fill="white" opacity="0.85"/>
                        <ellipse cx="-35" cy="8" rx="35" ry="22" fill="white" opacity="0.85"/>
                    </g>
                    <g class="cloud" transform="translate(800, 120)">
                        <ellipse cx="0" cy="0" rx="60" ry="35" fill="white" opacity="0.8"/>
                        <ellipse cx="50" cy="3" rx="45" ry="28" fill="white" opacity="0.8"/>
                        <ellipse cx="-45" cy="10" rx="40" ry="25" fill="white" opacity="0.8"/>
                    </g>
                </svg>
            </div>
            <div class="scene-content">
                <div class="hero-text">
                    <h1 class="title-main">葱油蒸鲈鱼</h1>
                    <p class="title-sub">一道治愈心灵的美食</p>
                    <div class="hero-illustration">
                        <svg viewBox="0 0 300 200" class="fish-hero">
                            <ellipse cx="150" cy="100" rx="100" ry="45" fill="#FF8A5C" stroke="#E5734D" stroke-width="3"/>
                            <ellipse cx="150" cy="95" rx="90" ry="38" fill="#FFA07A"/>
                            <circle cx="100" cy="90" r="12" fill="white"/>
                            <circle cx="100" cy="90" r="6" fill="#333"/>
                            <circle cx="103" cy="87" r="2" fill="white"/>
                            <path d="M50 95 Q60 85 70 95" stroke="#E5734D" stroke-width="2" fill="none"/>
                            <path d="M250 70 L280 55 L280 85 Z" fill="#FF7043"/>
                            <path d="M250 130 L280 145 L280 115 Z" fill="#FF7043"/>
                            <path d="M150 55 L150 30 L138 40 Z" fill="#FF7043"/>
                            <g class="bubbles">
                                <circle cx="220" cy="50" r="4" fill="white" opacity="0.7">
                                    <animate attributeName="cy" values="50;20;50" dur="2s" repeatCount="indefinite"/>
                                    <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
                                </circle>
                                <circle cx="240" cy="70" r="3" fill="white" opacity="0.6">
                                    <animate attributeName="cy" values="70;35;70" dur="2.5s" repeatCount="indefinite"/>
                                    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
                                </circle>
                                <circle cx="210" cy="130" r="4.5" fill="white" opacity="0.75">
                                    <animate attributeName="cy" values="130;90;130" dur="3s" repeatCount="indefinite"/>
                                    <animate attributeName="opacity" values="0.75;0;0.75" dur="3s" repeatCount="indefinite"/>
                                </circle>
                            </g>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="scroll-indicator">
                <span>向下滑动</span>
                <div class="arrow-down"></div>
            </div>
        </section>

        <!-- 场景 2: 食材 -->
        <section class="scene scene-ingredients" data-scene="2">
            <div class="scene-background">
                <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                    <defs>
                        <linearGradient id="kitchenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#FFF8E7"/>
                            <stop offset="100%" stop-color="#FFE8C8"/>
                        </linearGradient>
                    </defs>
                    <rect width="1200" height="800" fill="url(#kitchenGradient)"/>
                    <rect x="0" y="550" width="1200" height="250" fill="#D4A574"/>
                    <rect x="0" y="550" width="1200" height="20" fill="#C49A6C"/>
                    <line x1="0" y1="620" x2="1200" y2="620" stroke="#B89368" stroke-width="2"/>
                    <line x1="0" y1="700" x2="1200" y2="700" stroke="#B89368" stroke-width="2"/>
                </svg>
            </div>
            <div class="scene-content">
                <div class="section-header">
                    <h2 class="section-title">准备食材</h2>
                    <p class="section-desc">新鲜的食材是美味的开始</p>
                </div>
                <div class="ingredients-list">
                    <div class="ingredient-item fade-in">
                        <div class="ingredient-icon">
                            <svg viewBox="0 0 100 100">
                                <ellipse cx="50" cy="55" rx="40" ry="20" fill="#FF8A5C"/>
                                <ellipse cx="50" cy="52" rx="35" ry="17" fill="#FFA07A"/>
                                <circle cx="35" cy="50" r="6" fill="white"/>
                                <circle cx="35" cy="50" r="3" fill="#333"/>
                                <path d="M15 53 Q20 48 25 53" stroke="#E5734D" stroke-width="1.5" fill="none"/>
                            </svg>
                        </div>
                        <div class="ingredient-info">
                            <h3>鲈鱼</h3>
                            <p>1 条 新鲜的</p>
                        </div>
                    </div>
                    <div class="ingredient-item fade-in">
                        <div class="ingredient-icon">
                            <svg viewBox="0 0 100 100">
                                <rect x="45" y="15" width="10" height="70" rx="3" fill="#5ABF6D"/>
                                <rect x="46" y="15" width="8" height="70" rx="2" fill="#7ED38A"/>
                                <ellipse cx="50" cy="18" rx="7" ry="4" fill="#A8E6B0"/>
                            </svg>
                        </div>
                        <div class="ingredient-info">
                            <h3>葱</h3>
                            <p>2 根 翠绿的</p>
                        </div>
                    </div>
                    <div class="ingredient-item fade-in">
                        <div class="ingredient-icon">
                            <svg viewBox="0 0 100 100">
                                <ellipse cx="50" cy="55" rx="30" ry="22" fill="#E8B86D"/>
                                <ellipse cx="50" cy="52" rx="26" ry="18" fill="#F0CB8D"/>
                                <path d="M35 45 Q50 38 65 45" stroke="#D4A05A" stroke-width="1.5" fill="none"/>
                                <ellipse cx="50" cy="35" rx="12" ry="7" fill="#C48F4A"/>
                            </svg>
                        </div>
                        <div class="ingredient-info">
                            <h3>姜</h3>
                            <p>1 块 温暖的</p>
                        </div>
                    </div>
                    <div class="ingredient-item fade-in">
                        <div class="ingredient-icon">
                            <svg viewBox="0 0 100 100">
                                <rect x="30" y="30" width="40" height="50" rx="5" fill="#B7410E"/>
                                <rect x="33" y="33" width="34" height="44" rx="4" fill="#D45D1A"/>
                                <rect x="32" y="18" width="36" height="15" rx="3" fill="#5D4037"/>
                                <text x="50" y="65" text-anchor="middle" font-size="10" fill="#FDE0B6" font-weight="500">酱油</text>
                            </svg>
                        </div>
                        <div class="ingredient-info">
                            <h3>蒸鱼豉油</h3>
                            <p>1 勺 鲜美的</p>
                        </div>
                    </div>
                    <div class="ingredient-item fade-in">
                        <div class="ingredient-icon">
                            <svg viewBox="0 0 100 100">
                                <path d="M30 28 L30 72 Q30 78 38 78 L62 78 Q70 78 70 72 L70 28 Z" fill="#FFD700"/>
                                <path d="M33 28 L33 68 Q33 73 40 73 L60 73 Q67 73 67 68 L67 28" fill="#FFE55C"/>
                                <ellipse cx="50" cy="28" rx="16" ry="5" fill="#E6C800"/>
                                <ellipse cx="50" cy="72" rx="14" ry="7" fill="#E6B800"/>
                                <rect x="38" y="15" width="24" height="15" rx="3" fill="#8D6E4C"/>
                            </svg>
                        </div>
                        <div class="ingredient-info">
                            <h3>食用油</h3>
                            <p>5 克 金黄的</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 场景 3: 预处理 -->
        <section class="scene scene-prep" data-scene="3">
            <div class="scene-background">
                <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                    <rect width="1200" height="800" fill="#FFF5E6"/>
                    <rect x="0" y="500" width="1200" height="300" fill="#C9A86C"/>
                    <rect x="0" y="500" width="1200" height="18" fill="#B89A60"/>
                </svg>
            </div>
            <div class="scene-content">
                <div class="section-header">
                    <h2 class="section-title">预处理</h2>
                    <p class="section-desc">简单几步，美味在握</p>
                </div>
                <div class="prep-steps">
                    <div class="step-card fade-in">
                        <div class="step-number">1</div>
                        <div class="step-content">
                            <h3>鱼身划刀</h3>
                            <div class="step-illustration">
                                <svg viewBox="0 0 150 100">
                                    <ellipse cx="75" cy="50" rx="55" ry="25" fill="#FF8A5C"/>
                                    <ellipse cx="75" cy="47" rx="50" ry="22" fill="#FFA07A"/>
                                    <line x1="45" y1="40" x2="45" y2="60" stroke="#E5734D" stroke-width="2"/>
                                    <line x1="65" y1="38" x2="65" y2="62" stroke="#E5734D" stroke-width="2"/>
                                    <line x1="85" y1="38" x2="85" y2="62" stroke="#E5734D" stroke-width="2"/>
                                    <line x1="105" y1="40" x2="105" y2="60" stroke="#E5734D" stroke-width="2"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="step-card fade-in">
                        <div class="step-number">2</div>
                        <div class="step-content">
                            <h3>塞入姜片</h3>
                            <div class="step-illustration">
                                <svg viewBox="0 0 150 100">
                                    <ellipse cx="60" cy="55" rx="40" ry="20" fill="#FF8A5C"/>
                                    <ellipse cx="60" cy="52" rx="36" ry="17" fill="#FFA07A"/>
                                    <ellipse cx="100" cy="50" rx="12" ry="9" fill="#E8B86D">
                                        <animateTransform attributeName="transform" type="translate" values="0,0; -25,0; -25,0" dur="3s" repeatCount="indefinite"/>
                                    </ellipse>
                                </svg>
                            </div>
                        </div>
                    </div>
                    <div class="step-card fade-in">
                        <div class="step-number">3</div>
                        <div class="step-content">
                            <h3>装盘待蒸</h3>
                            <div class="step-illustration">
                                <svg viewBox="0 0 150 100">
                                    <ellipse cx="75" cy="70" rx="55" ry="15" fill="#8B7355"/>
                                    <ellipse cx="75" cy="68" rx="50" ry="12" fill="#A08060"/>
                                    <ellipse cx="75" cy="55" rx="35" ry="15" fill="#FF8A5C"/>
                                    <ellipse cx="75" cy="53" rx="31" ry="13" fill="#FFA07A"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 场景 4: 蒸煮 -->
        <section class="scene scene-cooking" data-scene="4">
            <div class="scene-background">
                <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                    <defs>
                        <linearGradient id="cookingBg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#FFF0E0"/>
                            <stop offset="100%" stop-color="#FFE0C0"/>
                        </linearGradient>
                    </defs>
                    <rect width="1200" height="800" fill="url(#cookingBg)"/>
                    <rect x="0" y="600" width="1200" height="200" fill="#D4A574"/>
                </svg>
            </div>
            <div class="scene-content">
                <div class="section-header">
                    <h2 class="section-title">蒸煮中...</h2>
                    <p class="section-desc">等待美味蜕变的时刻</p>
                </div>
                <div class="cooking-illustration">
                    <svg viewBox="0 0 300 250" class="steamer">
                        <ellipse cx="150" cy="230" rx="90" ry="12" fill="#666" opacity="0.3"/>
                        <path d="M80 110 L70 210 Q70 225 80 225 L220 225 Q230 225 230 210 L220 110 Z" fill="#5D4037"/>
                        <path d="M85 110 L76 205 Q76 218 85 218 L215 218 Q224 218 224 205 L215 110 Z" fill="#6D4C41"/>
                        <rect x="90" y="95" width="120" height="18" rx="6" fill="#4E342E"/>
                        <ellipse cx="150" cy="85" rx="22" ry="12" fill="#3E2723"/>
                        <g class="steam">
                            <path d="M145 75 Q135 55 150 35 Q165 15 155 -5" stroke="white" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6">
                                <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite"/>
                            </path>
                            <path d="M155 70 Q170 50 160 25 Q150 0 165 -20" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5">
                                <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.5s" repeatCount="indefinite"/>
                            </path>
                            <path d="M140 70 Q125 55 135 35 Q145 15 130 -5" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.55">
                                <animate attributeName="opacity" values="0.15;0.65;0.15" dur="2.2s" repeatCount="indefinite"/>
                            </path>
                        </g>
                        <rect x="100" y="130" width="100" height="50" rx="4" fill="rgba(255,138,92,0.3)"/>
                        <ellipse cx="150" cy="155" rx="38" ry="18" fill="#FF8A5C" opacity="0.95"/>
                        <ellipse cx="150" cy="152" rx="33" ry="15" fill="#FFA07A"/>
                    </svg>
                </div>
                <div class="progress-display">
                    <div class="progress-bar-wrapper">
                        <div class="progress-bar-fill" id="cookingProgress"></div>
                    </div>
                    <div class="progress-text">
                        <span class="progress-percent" id="progressPercent">0%</span>
                        <span class="progress-status">热传导中...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 场景 5: 淋油 -->
        <section class="scene scene-oil" data-scene="5">
            <div class="scene-background">
                <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                    <rect width="1200" height="800" fill="#FFF8E7"/>
                    <rect x="0" y="550" width="1200" height="250" fill="#C9A86C"/>
                </svg>
            </div>
            <div class="scene-content">
                <div class="section-header">
                    <h2 class="section-title">淋油时刻</h2>
                    <p class="section-desc">滋啦一声，香气四溢</p>
                </div>
                <div class="oil-action">
                    <svg viewBox="0 0 350 250" class="oil-svg">
                        <ellipse cx="175" cy="220" rx="80" ry="10" fill="#888" opacity="0.3"/>
                        <ellipse cx="175" cy="190" rx="70" ry="20" fill="#F5F5F5" stroke="#DDD" stroke-width="3"/>
                        <ellipse cx="175" cy="187" rx="62" ry="16" fill="#FFFAF0"/>
                        <ellipse cx="175" cy="165" rx="45" ry="22" fill="#FF8A5C"/>
                        <ellipse cx="175" cy="162" rx="40" ry="19" fill="#FFA07A"/>
                        <g id="greenOnions">
                            <circle cx="150" cy="158" r="5" fill="#5ABF6D"/>
                            <circle cx="170" cy="155" r="4" fill="#7ED38A"/>
                            <circle cx="190" cy="158" r="5" fill="#5ABF6D"/>
                            <circle cx="160" cy="170" r="4" fill="#7ED38A"/>
                            <circle cx="185" cy="168" r="4.5" fill="#5ABF6D"/>
                        </g>
                        <g class="oil-bottle">
                            <rect x="260" y="40" width="35" height="65" rx="5" fill="#FFD700"/>
                            <rect x="263" y="40" width="29" height="58" rx="4" fill="#FFE55C"/>
                            <rect x="268" y="25" width="20" height="18" rx="3" fill="#8D6E4C"/>
                        </g>
                        <g class="oil-stream">
                            <path d="M277 105 Q240 140 200 155" stroke="#FFD700" stroke-width="8" stroke-linecap="round" fill="none" opacity="0">
                                <animate attributeName="opacity" values="0;0.9;0" dur="1.5s" repeatCount="indefinite"/>
                            </path>
                            <circle cx="200" cy="155" r="3" fill="#FFD700" opacity="0">
                                <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
                            </circle>
                            <circle cx="190" cy="158" r="2.5" fill="#FFE55C" opacity="0">
                                <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
                            </circle>
                        </g>
                    </svg>
                    <button class="sizzle-btn" id="sizzleBtn">
                        <span>点击滋啦!</span>
                        <span class="sizzle-emoji">🔥</span>
                    </button>
                    <div class="sizzle-text" id="sizzleText">滋啦 ——</div>
                </div>
            </div>
        </section>

        <!-- 场景 6: 完成 -->
        <section class="scene scene-finish" data-scene="6">
            <div class="scene-background">
                <svg class="bg-svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
                    <defs>
                        <radialGradient id="finishSky" cx="50%" cy="40%" r="70%">
                            <stop offset="0%" stop-color="#FFECDB"/>
                            <stop offset="50%" stop-color="#FFD4B8"/>
                            <stop offset="100%" stop-color="#FFC0A0"/>
                        </radialGradient>
                    </defs>
                    <rect width="1200" height="800" fill="url(#finishSky)"/>
                    <g class="sparkles">
                        <circle cx="150" cy="150" r="4" fill="#FFD700">
                            <animate attributeName="r" values="3;5;3" dur="1.5s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="300" cy="200" r="3" fill="#FFE55C">
                            <animate attributeName="r" values="2;4;2" dur="2s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="900" cy="180" r="4" fill="#FFD700">
                            <animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="1000" cy="250" r="3" fill="#FFE55C">
                            <animate attributeName="r" values="2.5;4.5;2.5" dur="2.2s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.55;0.95;0.55" dur="2.2s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="500" cy="120" r="3.5" fill="#FFD700">
                            <animate attributeName="r" values="2.5;4.5;2.5" dur="1.7s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0.58;0.98;0.58" dur="1.7s" repeatCount="indefinite"/>
                        </circle>
                    </g>
                </svg>
            </div>
            <div class="scene-content">
                <div class="finish-display">
                    <div class="finish-illustration">
                        <svg viewBox="0 0 300 220" class="finish-fish">
                            <ellipse cx="150" cy="200" rx="95" ry="12" fill="#888" opacity="0.25"/>
                            <ellipse cx="150" cy="175" rx="85" ry="25" fill="#F8F4F0" stroke="#E8E4E0" stroke-width="3"/>
                            <ellipse cx="150" cy="172" rx="75" ry="20" fill="#FFFAF5"/>
                            <ellipse cx="150" cy="140" rx="60" ry="28" fill="#FF8A5C"/>
                            <ellipse cx="150" cy="137" rx="54" ry="24" fill="#FFA07A"/>
                            <g class="onions">
                                <circle cx="125" cy="132" r="5" fill="#5ABF6D"/>
                                <circle cx="145" cy="128" r="4" fill="#7ED38A"/>
                                <circle cx="165" cy="130" r="5" fill="#5ABF6D"/>
                                <circle cx="185" cy="133" r="4" fill="#7ED38A"/>
                                <circle cx="135" cy="145" r="4" fill="#5ABF6D"/>
                                <circle cx="155" cy="147" r="5" fill="#7ED38A"/>
                                <circle cx="175" cy="145" r="4" fill="#5ABF6D"/>
                            </g>
                            <g class="shine">
                                <circle cx="130" cy="130" r="3" fill="white" opacity="0.7">
                                    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.2s" repeatCount="indefinite"/>
                                </circle>
                                <circle cx="170" cy="135" r="2.5" fill="white" opacity="0.6">
                                    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite"/>
                                </circle>
                            </g>
                        </svg>
                    </div>
                    <div class="finish-text">
                        <h2 class="finish-title">完成！</h2>
                        <p class="finish-subtitle">一道美味的葱油蒸鲈鱼</p>
                    </div>
                    <div class="nutrition-info">
                        <div class="nutrient-item">
                            <span class="nutrient-label">蛋白质</span>
                            <span class="nutrient-value">33g</span>
                        </div>
                        <div class="nutrient-item">
                            <span class="nutrient-label">脂肪</span>
                            <span class="nutrient-value">8g</span>
                        </div>
                        <div class="nutrient-item">
                            <span class="nutrient-label">碳水</span>
                            <span class="nutrient-value">0g</span>
                        </div>
                        <div class="nutrient-item">
                            <span class="nutrient-label">时长</span>
                            <span class="nutrient-value">16min</span>
                        </div>
