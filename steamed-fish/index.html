<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>葱油蒸鲈鱼段 - 练后高蛋白补给</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="scene" id="scene0">
            <div class="code-text">
                <pre>/* 葱油蒸鲈鱼段.c */
// 练后高蛋白补给 | 总耗时: 16min | 蛋白质: ~33g</pre>
            </div>
        </div>

        <div class="scene" id="scene1">
            <div class="ingredients-scene">
                <div class="food-image">
                    <div class="placeholder-image">🍱 食材全家福</div>
                </div>
                <div class="code-text typewriter" id="scene1-text"></div>
            </div>
        </div>

        <div class="scene" id="scene2">
            <div class="prep-scene">
                <div class="code-text typewriter" id="scene2-text"></div>
            </div>
        </div>

        <div class="scene" id="scene3">
            <div class="cooking-scene">
                <div class="code-text" id="scene3-text"></div>
            </div>
        </div>

        <div class="scene" id="scene4">
            <div class="oil-scene">
                <div class="code-box">
                    <pre>╔══════════════════════╗
║  call therm()        ║
║   参数: 油 5g        ║
║   入微波炉: 30s      ║
║   淋油 -&gt; 完成        ║
╚══════════════════════╝</pre>
                </div>
                <button class="sizzle-btn" id="sizzleBtn">滋啦效果</button>
                <div class="sizzle-text" id="sizzleText">「滋啦——」</div>
            </div>
        </div>

        <div class="scene" id="scene5">
            <div class="return-scene">
                <div class="code-box typewriter" id="scene5-text"></div>
            </div>
        </div>

        <div class="scene" id="scene6">
            <div class="code-text">
                <pre>&gt; 状态: 补给完成
  下一道菜: 待定

  sleep(3h)  // 晚安</pre>
            </div>
        </div>

        <div class="controls">
            <button class="nav-btn" id="prevBtn">上一步</button>
            <span class="scene-counter" id="sceneCounter">1 / 7</span>
            <button class="nav-btn" id="nextBtn">下一步</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
